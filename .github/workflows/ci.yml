name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger, so the visual job's baseline bootstrap can be re-run
  # without pushing a commit to provoke it. Linux baselines cannot be
  # generated on a developer's machine (see `snapshotPathTemplate`), so this
  # workflow is the only place they come from.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Corepack must not stop to ask before fetching the pinned Yarn release.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  verify:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Before setup-node: v5 caches by default and shells out to `yarn`,
      # which is Yarn 1 until Corepack swaps in the pinned packageManager.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('yarn.lock') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: ${{ runner.os }}-next-${{ hashFiles('yarn.lock') }}-

      - run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Verify the registry was generated
        run: |
          test -f public/r/registry.json || { echo "::error::registry.json missing"; exit 1; }
          count=$(node -p "require('./public/r/registry.json').items.length")
          echo "registry items: $count"
          test "$count" -gt 0 || { echo "::error::registry is empty"; exit 1; }

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: yarn test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Motion frames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      # Baselines are platform-specific; see `snapshotPathTemplate` in
      # playwright.config.ts. This runner is the only platform whose set is
      # committed, which is why the suite runs here and not on a developer's
      # machine.
      - name: Compare motion frames
        run: yarn test:visual

      - name: Upload diffs and any newly written baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: |
            playwright-report/
            tests/visual/__screenshots__/
          retention-days: 7
